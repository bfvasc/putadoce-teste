<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Putadoce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/loading.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="components/nav/nav.css" />
  <link rel="stylesheet" href="css/hero.css" />
</head>
<body>
  <div class="loading-screen" id="loadingScreen" aria-hidden="true">
    <div class="loading-track" id="loadingTrack">
      <button type="button" class="loading-item" data-item="1" aria-pressed="true" aria-label="Ver bolo buttercream">
        <img class="loading-item__img" src="assets/images/homepage/image-cake-1.png" alt="" />
      </button>
      <button type="button" class="loading-item" data-item="2" aria-pressed="false" aria-label="Ver bolo bala de goma">
        <img class="loading-item__img" src="assets/images/homepage/image-cake-2.png" alt="" />
      </button>
      <button type="button" class="loading-item" data-item="3" aria-pressed="false" aria-label="Ver bolo arte e artistas">
        <img class="loading-item__img" src="assets/images/homepage/image-cake-3.png" alt="" />
      </button>
      <button type="button" class="loading-item" data-item="4" aria-pressed="false" aria-label="Ver bolo criar e inovar">
        <img class="loading-item__img" src="assets/images/homepage/image-cake-4.png" alt="" />
      </button>
    </div>

    <div class="loading-circle"></div>
  </div>

  <section class="hero" id="hero">
    <div class="hero__cluster">
      <p class="hero__text hero__text--fixed hero__reveal">nós amamos</p>

      <div class="hero__cake" id="heroCake" data-cake="1">
        <img
          class="hero__cake-img"
          src="assets/images/homepage/image-cake-central-1.png"
          alt="Bolo com buttercream azul e confetes coloridos"
        />
      </div>

      <p class="hero__text hero__text--variable hero__reveal">
        <span class="hero__word hero__word--variable" id="heroVariableWord">buttercream</span>
      </p>
    </div>

    <button type="button" class="hero__cta btn-solid hero__reveal" id="heroCta">
      <span class="hero__cta-label">Pedir no Goomer</span>
      <img class="hero__cta-icon btn-solid__icon" src="assets/icons/icon-arrow-right.svg" alt="" />
    </button>
  </section>

  <script src="js/loading.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/cake-switcher.js"></script>
  <script src="components/nav/nav.js"></script>
</body>
</html>
